# Compila y publica una release con el APK al subir un tag vX.Y.Z
# (o a mano desde la pestaña Actions). Necesita estos secrets en el repo:
#   DEPORTV_KEYSTORE_B64   -> keystore en base64
#   DEPORTV_STORE_PASSWORD, DEPORTV_KEY_ALIAS, DEPORTV_KEY_PASSWORD
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Clave de firma
        run: echo "${{ secrets.DEPORTV_KEYSTORE_B64 }}" | base64 -d > app/deportv.keystore
      - name: Tests y compilación
        env:
          DEPORTV_KEYSTORE: app/deportv.keystore
          DEPORTV_STORE_PASSWORD: ${{ secrets.DEPORTV_STORE_PASSWORD }}
          DEPORTV_KEY_ALIAS: ${{ secrets.DEPORTV_KEY_ALIAS }}
          DEPORTV_KEY_PASSWORD: ${{ secrets.DEPORTV_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk DeporTV-$VERSION.apk
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: DeporTV ${{ env.VERSION }}
          files: DeporTV-${{ env.VERSION }}.apk
          generate_release_notes: true
